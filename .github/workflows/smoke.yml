name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      - name: Purge Cloudflare cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [[ -z "${CF_ZONE_ID}" || -z "${CF_API_TOKEN}" ]]; then
            echo "CF_ZONE_ID or CF_API_TOKEN not set — skipping Cloudflare purge."
            exit 0
          fi
          http_status=$(curl -s \
            -o /tmp/cf_response.json \
            -w "%{http_code}" \
            -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "Cloudflare API response (HTTP ${http_status}):"
          cat /tmp/cf_response.json
          if [ "${http_status}" != "200" ]; then
            echo "Cache purge failed — HTTP ${http_status}"
            exit 1
          fi
          echo "Cache purge succeeded"
