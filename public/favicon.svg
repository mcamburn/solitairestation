<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" fill="none">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#a87820"/>
    </linearGradient>
  </defs>

  <!-- Card body -->
  <rect x="1" y="1" width="34" height="42" rx="5" fill="url(#card-grad)" filter="url(#card-shadow)"/>
  <!-- Inset border -->
  <rect x="2.5" y="2.5" width="31" height="39" rx="4" fill="none" stroke="#f5e080" stroke-width="0.7" stroke-opacity="0.45"/>

  <!-- Spade suit — center of card -->
  <circle cx="13" cy="22" r="7.2" fill="#1a3020"/>
  <circle cx="23" cy="22" r="7.2" fill="#1a3020"/>
  <polygon points="18,10 11,24 25,24" fill="#1a3020"/>
  <rect x="15.5" y="28" width="5" height="5" rx="1" fill="#1a3020"/>
  <ellipse cx="18" cy="35" rx="5.5" ry="2" fill="#1a3020"/>

  <!-- Corner rank labels -->
  <text x="4" y="11" font-family="Georgia, serif" font-size="8" font-weight="700" fill="#1a3020">♠</text>
  <text x="23" y="41" font-family="Georgia, serif" font-size="8" font-weight="700" fill="#1a3020" transform="rotate(180 26 38)">♠</text>
</svg>
